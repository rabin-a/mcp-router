[package]
name = "mcp-router"
version = "0.2.0"
edition = "2024"
description = "One MCP server in front of many: tool search, lazy start, JSON shaping and code mode"
license = "MIT"
repository = "https://github.com/rabin-a/mcp-router"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
futures = "0.3.34"
http = "1"
rmcp = { version = "3.5.1", features = ["server", "client", "transport-io", "transport-child-process", "macros", "transport-streamable-http-client-reqwest", "reqwest"] }
rquickjs = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
